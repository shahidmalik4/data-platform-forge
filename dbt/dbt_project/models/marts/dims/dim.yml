version: 2

models:

  # =========================
  # DIM CUSTOMERS (SCD2)
  # =========================
  - name: dim_customers
    description: "SCD Type 2 customer dimension"

    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: is_current
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

    tests:
      # Only one current record per customer
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - is_current

      # Optional: ensure valid date range
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dbt_valid_from <= dbt_valid_to"

  # =========================
  # DIM PRODUCTS
  # =========================
  - name: dim_products
    description: "Product dimension"

    columns:
      - name: product_sk
        tests:
          - not_null
          - unique

      - name: product_id
        tests:
          - not_null

      - name: price
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "{{ column_name }} >= 0"