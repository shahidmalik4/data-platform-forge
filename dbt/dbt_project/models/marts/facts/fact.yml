version: 2

models:

  # =========================
  # FACT ORDERS
  # =========================
  - name: fact_orders

    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: total_amount
        tests:
          - not_null

      - name: shipping_cost
        tests:
          - not_null

      - name: net_revenue
        tests:
          - not_null


  # =========================
  # FACT LINE ITEMS
  # =========================
  - name: fact_line_items

    columns:

      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: quantity
        tests:
          - not_null

      - name: unit_price
        tests:
          - not_null

      - name: discount_amount
        tests:
          - not_null

      - name: gross_item_total
        tests:
          - not_null

      - name: net_item_total
        tests:
          - not_null