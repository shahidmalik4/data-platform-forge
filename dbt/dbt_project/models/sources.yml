version: 2

sources:
  - name: raw
    schema: raw

    tables:
      - name: customers
        description: "Raw customer data from operational system"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        config:
          meta:
            dagster:
              asset_key: ["ingestion_asset"]

      - name: orders
        description: "Raw order transactions"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        config:
          meta:
            dagster:
              asset_key: ["ingestion_asset"]

      - name: orders__items
        description: "Raw order items catalog"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        config:
          meta:
            dagster:
              asset_key: ["ingestion_asset"]

      - name: products
        description: "Raw product catalog"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        config:
          meta:
            dagster:
              asset_key: ["ingestion_asset"]